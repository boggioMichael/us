name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

# Every step that can fail turns its errors into annotations
# (tools/ci-annotate.sh), so a red run says why on its page.

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # the Windows build is published as a release (below)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The toolchain the code is written against (newer Rust gets its own job below).
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # OCR: Linux and macOS use Tesseract; Windows has its own OCR engine.
      - name: Install Tesseract and ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - name: Install Tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Versions
        run: rustc --version && cargo clippy --version && (tesseract --version 2>&1 | head -1 || true)
      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check 2>&1 | tee fmt.log || { echo "::error title=cargo fmt::$(head -c 3000 fmt.log | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
      - name: Lints
        run: set -o pipefail; cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log || { tools/ci-annotate.sh clippy.log "clippy"; exit 1; }
      - name: What Windows' OCR reads (diagnostic)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          cargo test -p syrup-perception --lib windows_ocr_reads_hud_text -- --nocapture 2>&1 | tee wocr.log
          echo "::notice title=windows ocr::$(grep -a 'windows ocr' wocr.log | head -1 | sed 's/%/%25/g')"
      - name: Tests (unit, program, end to end on three games)
        run: set -o pipefail; cargo test --workspace 2>&1 | tee test.log || { tools/ci-annotate.sh test.log "tests"; exit 1; }
      - name: Three games, measured
        if: always()
        run: test -f target/tmp/syrup-e2e.txt && echo "::notice title=three games (${{ runner.os }})::$(awk 'BEGIN { ORS = "%0A" } { gsub(/%/, "%25"); print }' target/tmp/syrup-e2e.txt)" || true
      - name: Release build
        run: set -o pipefail; cargo build --release -p syrup-desktop 2>&1 | tee release.log || { tools/ci-annotate.sh release.log "release build"; exit 1; }
      - name: Draw Syrup
        run: ./target/release/syrup avatar --out avatar
      - name: Install the phone app's brain, the way a player would (Windows)
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          startup="$(cygpath "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Startup/Syrup.vbs"
          ./target/release/syrup.exe install 2>&1 | tee install.log
          curl -sf http://127.0.0.1:8080/healthz && echo
          test -f "$startup" || { echo "::error title=install::no launcher in the Startup folder"; exit 1; }
          ./target/release/syrup.exe uninstall
          if test -f "$startup"; then echo "::error title=uninstall::the launcher is still in the Startup folder"; exit 1; fi
          if curl -sf http://127.0.0.1:8080/healthz; then echo "::error title=uninstall::Syrup is still running"; exit 1; fi
          echo "::notice title=install (Windows)::$(grep -a -m1 'running' install.log | sed 's/%/%25/g')"
      # For running Syrup's brain on a Windows PC (the phone app's server):
      # syrup.exe and double-click installers, on one release page that
      # every push to this branch updates.
      - name: Publish the Windows build
        if: runner.os == 'Windows' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p publish
          cp target/release/syrup.exe tools/windows/*.cmd publish/
          (cd publish && 7z a -tzip ../syrup-windows.zip syrup.exe *.cmd > /dev/null)
          tag="syrup-windows-${GITHUB_REF_NAME//\//-}"
          notes="Syrup for Windows, built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Unzip, then double-click Install Syrup.cmd: the phone app's brain runs on this PC from then on (docs/iphone.md)."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "Syrup for Windows ($GITHUB_REF_NAME)" --notes "$notes"
          fi
          gh release upload "$tag" syrup-windows.zip --clobber
          echo "::notice title=Windows build::https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/syrup-windows.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-avatar-${{ matrix.os }}
          path: |
            avatar
            *.log

  clippy-latest:
    name: Lints on the newest Rust (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lints
        run: set -o pipefail; cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy.log || { tools/ci-annotate.sh clippy.log "clippy (newest Rust)"; exit 1; }

  devtools:
    name: Devtools page compiles and is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@5
      - name: Compile
        working-directory: apps/devtools
        run: tsc -p tsconfig.json
      - name: The committed page is what the source compiles to
        run: git diff --exit-code -- apps/devtools/dist

  server-image:
    name: The phone app's server builds and answers (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the image
        run: docker build -t syrup-server . 2>&1 | tail -40
      - name: Run it, and be a phone for a moment
        run: |
          set -eu
          docker run -d --name syrup -p 8080:8080 -e SYRUP_TOKEN=ci-token syrup-server
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/v1/say?device=ci-phone')
          test "$code" = 401 || { echo "::error title=server::a request without the token got $code"; exit 1; }
          auth='Authorization: Bearer ci-token'
          curl -sf -H "$auth" -X POST --data '{"title":"Dungeon 3D"}' 'localhost:8080/v1/game?device=ci-phone'
          echo
          for i in 1 2 3; do
            curl -sf -H "$auth" --data-binary @assets/syrup/avatar.json 'localhost:8080/v1/frame?device=ci-phone' -o /dev/null -w '%{http_code} ' || true
          done
          curl -sf -H "$auth" --data-binary @docs/images/hats.png "localhost:8080/v1/frame?device=ci-phone&t=0" | tee frame.json
          echo
          grep -q '"interval_ms"' frame.json
          curl -sf -H "$auth" -X POST 'localhost:8080/v1/end?device=ci-phone'
          echo
          curl -sf -H "$auth" 'localhost:8080/v1/say?device=ci-phone&after=0' | tee said.json
          echo
          grep -q '"end":true' said.json || { echo "::error title=server::no summary after the session ended"; exit 1; }
          echo "::notice title=server::$(sed 's/%/%25/g' said.json)"
      - name: Server log
        if: always()
        run: docker logs syrup 2>&1 | tail -50 || true

  live-windows:
    name: Live on Windows (a test game in a real window)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: set -o pipefail; cargo build --release -p syrup-desktop 2>&1 | tee build.log || { tools/ci-annotate.sh build.log "build"; exit 1; }
      - name: Name the test game like a real game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, games | Out-Null
          # Named like a real game's executable, the test game is "Dungeon 3D" to Windows.
          Copy-Item target\release\syrup-testgame.exe games\dungeon3d.exe
      - name: Each part live on its own (diagnostic)
        shell: pwsh
        continue-on-error: true
        run: |
          $game = Start-Process -FilePath games\dungeon3d.exe -ArgumentList "--seconds", "150" -PassThru
          Start-Sleep -Seconds 4
          $runs = @(
            @{ name = "no overlay, no OCR"; args = @("--no-overlay", "--ocr", "none") },
            @{ name = "overlay, no OCR"; args = @("--ocr", "none") },
            @{ name = "no overlay, Windows OCR"; args = @("--no-overlay") },
            @{ name = "overlay, Windows OCR"; args = @() }
          )
          $report = @()
          $i = 0
          foreach ($r in $runs) {
            $i++
            $all = @("live", "--window", "Dungeon 3D", "--seconds", "8", "--no-voice", "--no-research", "--data-dir", "out\diag$i") + $r.args
            $env:SYRUP_TRACE = "1"
            & target\release\syrup.exe @all 2> "out\diag$i.log" > "out\diag$i.txt"
            $code = $LASTEXITCODE
            $env:SYRUP_TRACE = $null
            $last = (Get-Content "out\diag$i.log" | Select-Object -Last 4) -join " / "
            $report += "$($r.name): exit $code ($last)"
          }
          Write-Output "::notice title=live parts::$($report -join '%0A')"
          Stop-Process -Id $game.Id -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
      - name: Watch the dungeon live
        shell: pwsh
        run: |
          function Fail($why) {
            $tail = (Get-Content out\live.log -ErrorAction SilentlyContinue | Select-Object -Last 25) -join "%0A"
            Write-Output "::error title=live run::$why%0A$tail"
            exit 1
          }
          $game = Start-Process -FilePath games\dungeon3d.exe -ArgumentList "--seconds", "100" -PassThru
          Start-Sleep -Seconds 5
          target\release\syrup.exe windows | Tee-Object out\windows.txt
          target\release\syrup.exe live --window "Dungeon 3D" --seconds 50 --no-voice --no-research --overlay-dir out\overlay --data-dir out\data --json 2> out\live.log > out\summary.json
          $code = $LASTEXITCODE
          Get-Content out\live.log
          Get-Content out\summary.json
          if ($code -ne 0) { Fail "syrup live exited with $code" }
          $s = Get-Content out\summary.json -Raw | ConvertFrom-Json
          if ($s.title -ne "Dungeon 3D") { Fail "the game was not recognised: '$($s.title)'" }
          if ($s.analysed_frames -lt 40) { Fail "only $($s.analysed_frames) frames analysed" }
          $profile = Get-ChildItem out\data\games -Recurse -Filter profile.json | Select-Object -First 1
          if (-not $profile) { Fail "no profile saved" }
          $p = Get-Content $profile.FullName -Raw | ConvertFrom-Json
          if ($p.known_ui_elements.Count -lt 1) { Fail "no interface learned" }
          if (-not ($p.executables -contains "dungeon3d.exe")) { Fail "executable not learned: $($p.executables)" }
          if ((Get-ChildItem out\overlay -Filter *.png -ErrorAction SilentlyContinue).Count -lt 1) { Fail "no overlay pictures" }
          $timeline = Get-ChildItem out\data\sessions -Recurse -Filter timeline.jsonl | Select-Object -First 1
          $learned = (Select-String -Path $timeline.FullName -Pattern '"concept_learned"' | Measure-Object).Count
          Write-Output "concepts learned: $learned"
          if ($learned -lt 1) { Fail "nothing learned about the interface" }
          $said = (Get-Content $timeline.FullName | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.event.type -eq "advice_shown" } | ForEach-Object { "Syrup: " + $_.event.text }) -join "%0A"
          Write-Output "::notice title=live session::$($s.analysed_frames) frames analysed in $([math]::Round($s.duration_s)) s; learned $($s.concepts -join ', ')%0A$said"
          Stop-Process -Id $game.Id -ErrorAction SilentlyContinue
      - name: A second session remembers the game
        shell: pwsh
        run: |
          $game = Start-Process -FilePath games\dungeon3d.exe -ArgumentList "--seconds", "40", "--seed", "5" -PassThru
          Start-Sleep -Seconds 4
          target\release\syrup.exe live --exe dungeon3d.exe --seconds 15 --no-voice --no-research --data-dir out\data 2> out\live2.log > out\said2.txt
          Get-Content out\live2.log
          Get-Content out\said2.txt
          if (-not (Select-String -Path out\said2.txt -Pattern "again" -Quiet)) {
            $said = (Get-Content out\said2.txt) -join "%0A"
            Write-Output "::error title=second session::Syrup did not say it remembered the game.%0A$said"
            exit 1
          }
          target\release\syrup.exe profiles --data-dir out\data | Tee-Object out\profiles.txt
          $said = (Get-Content out\said2.txt) -join "%0A"
          Write-Output "::notice title=second session::$said"
          Stop-Process -Id $game.Id -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-windows
          path: |
            out
            *.log

  research-live:
    name: Research against the real web (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p syrup-desktop
      - name: Look up a few games
        run: |
          for game in "Hollow Knight" "MapleStory" "Balatro"; do
            ./target/release/syrup research "$game" --data-dir research-data | tee -a research.txt || true
          done
          ./target/release/syrup research "Hollow Knight" --topic "Hornet" --data-dir research-data | tee -a research.txt || true
          echo "::notice title=research::$(grep -c '^- ' research.txt) facts found"
      - uses: actions/upload-artifact@v4
        with:
          name: research-live
          path: research.txt
