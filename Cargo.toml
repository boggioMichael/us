[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop", "tests"]
# The syrup library is a submodule used as a path dependency, not a member:
# its own tests, benches and lints belong to its repository.
exclude = ["third_party/syrup"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/boggioMichael/us"
publish = false

[workspace.dependencies]
syrup = { path = "third_party/syrup" }
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minifb = "0.28"
regex = "1"
tempfile = "3"
syrup-core = { path = "crates/syrup-core" }
syrup-paint = { path = "crates/syrup-paint" }
syrup-capture = { path = "crates/syrup-capture" }
syrup-perception = { path = "crates/syrup-perception" }
syrup-state = { path = "crates/syrup-state" }
syrup-recognition = { path = "crates/syrup-recognition" }
syrup-knowledge = { path = "crates/syrup-knowledge" }
syrup-memory = { path = "crates/syrup-memory" }
syrup-player = { path = "crates/syrup-player" }
syrup-coach = { path = "crates/syrup-coach" }
syrup-avatar = { path = "crates/syrup-avatar" }
syrup-ui = { path = "crates/syrup-ui" }
syrup-plugins = { path = "crates/syrup-plugins" }
syrup-runtime = { path = "crates/syrup-runtime" }
syrup-testgames = { path = "crates/syrup-testgames" }

[workspace.dependencies.windows]
version = "0.61"
features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Speech",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
# Pixel code indexes arrays and passes coordinates; these are the norm there.
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"

[profile.release]
debug = 1

# Perception and the test games work on real frames: unoptimised code is too
# slow to test them in reasonable time.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
